services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kids-sound-app
    command: >
      bash -lc "npm install && npm run dev -- --hostname 0.0.0.0 --port 3000"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      - NODE_ENV=development
    restart: unless-stopped

volumes:
  node_modules:
